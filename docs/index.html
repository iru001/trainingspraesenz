<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingspräsenz</title>
<meta name="description" content="Anwesenheitserfassung für Training und Wettkampf.">
<meta name="theme-color" content="#1B6B48" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Präsenz">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700&display=swap">
<style id="app-style">

:root{
  --bg:#F0F3F1; --surface:#FFFFFF; --surface-2:#E7ECE9; --surface-3:#DCE3DF;
  --ink:#101A16; --ink-2:#44534C; --ink-3:#6F7E77;
  --line:#D5DCD8; --line-2:#C2CCC7;
  --accent:#1B6B48; --accent-2:#14563a; --on-accent:#FFFFFF; --accent-soft:#E1EFE8;
  --warn:#8E6210; --warn-soft:#F6EEDA;
  --bad:#A5322A; --bad-soft:#F8E5E3;
  --info:#2C5C88; --info-soft:#E2ECF5;
  --shadow:0 1px 2px rgba(16,26,22,.06),0 10px 24px -18px rgba(16,26,22,.45);
  --r:14px; --r-s:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1411; --surface:#141E19; --surface-2:#1B2822; --surface-3:#25342C;
    --ink:#E9EFEB; --ink-2:#A8B7AF; --ink-3:#7A8982;
    --line:#25342C; --line-2:#32443B;
    --accent:#4FBF89; --accent-2:#6FD3A2; --on-accent:#06150E; --accent-soft:#14291F;
    --warn:#E0AE55; --warn-soft:#2A2214;
    --bad:#EC8578; --bad-soft:#2E1A18;
    --info:#8FB6DC; --info-soft:#16232E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#141E19; --surface-2:#1B2822; --surface-3:#25342C;
  --ink:#E9EFEB; --ink-2:#A8B7AF; --ink-3:#7A8982;
  --line:#25342C; --line-2:#32443B;
  --accent:#4FBF89; --accent-2:#6FD3A2; --on-accent:#06150E; --accent-soft:#14291F;
  --warn:#E0AE55; --warn-soft:#2A2214;
  --bad:#EC8578; --bad-soft:#2E1A18;
  --info:#8FB6DC; --info-soft:#16232E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,.disp{font-family:Oswald,"Source Sans 3",Impact,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.topbar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:34px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.brand b{font-family:Oswald,sans-serif;font-weight:600;font-size:18px;line-height:1.15;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.back{
  display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 8px 6px 0;
  color:var(--accent);font-weight:600;font-size:15px;
}
.app{max-width:900px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{
  background:none;border:0;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  border-top:2px solid transparent;margin-top:-1px;
}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.nav button{position:relative}
.navbadge{
  position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 3px;
  border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;
}

/* ---------- building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.eyebrow{
  font-family:Oswald,sans-serif;font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:22px 0 10px;display:flex;align-items:center;gap:10px;
}
.eyebrow:first-child{margin-top:4px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:var(--r-s);padding:11px 15px;font-weight:600;font-size:15px;min-height:44px;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-ghost{border-color:transparent;background:var(--surface-2)}
.btn-danger{color:var(--bad);border-color:var(--line-2)}
.btn-sm{min-height:36px;padding:7px 11px;font-size:14px;border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:36px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);flex:none;
}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink);min-height:44px;
}
textarea{min-height:96px;line-height:1.45;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-3)}

.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;
  font-size:12px;font-weight:700;letter-spacing:.03em;border:1px solid transparent;white-space:nowrap;
}
.pill-training{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.pill-match{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.pill-open{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pill-done{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.pill-yes{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.pill-no{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.pill-wait{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}

.banner{
  border-radius:var(--r-s);padding:11px 13px;font-size:14px;line-height:1.45;
  background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));
  z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:999px;
  font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}

/* ---------- event list ---------- */
.ev{
  display:flex;align-items:stretch;gap:0;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;box-shadow:var(--shadow);
  color:inherit;font:inherit;
}
.ev-date{
  flex:none;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;padding:12px 6px;background:var(--surface-2);border-right:1px solid var(--line);
}
.ev-dow{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ev-day{font-family:Oswald,sans-serif;font-size:26px;line-height:1.05;font-weight:600}
.ev-mon{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ev-body{flex:1;min-width:0;padding:11px 13px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.ev-title{font-weight:700;font-size:16px;line-height:1.25}
.ev-meta{font-size:13px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.ev-side{flex:none;display:flex;align-items:center;padding-right:12px;color:var(--ink-3)}
.ev-side svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ev-quote{font-family:Oswald,sans-serif;font-size:17px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ev.is-late .ev-date{background:var(--warn-soft)}
.ev.is-late .ev-day,.ev.is-late .ev-dow,.ev.is-late .ev-mon{color:var(--warn)}
.ev.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}

/* ---------- attendance sheet ---------- */
.sheet-head{padding:14px;display:flex;flex-direction:column;gap:10px}
.sheet-title{font-family:Oswald,sans-serif;font-size:22px;font-weight:600;line-height:1.15}
.coach{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;min-height:40px;
}
.coach[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.coach[aria-pressed="true"] .muted{color:inherit;opacity:.72}
.coach svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 13px;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.pname{flex:1;min-width:0;font-size:15px;line-height:1.3}
.pname b{font-weight:700}
.pname small{display:block;font-size:12px;color:var(--ink-3)}
.seg{display:grid;grid-template-columns:repeat(4,38px);gap:4px;flex:none}
.seg button{
  height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);
  color:var(--ink-3);font-family:Oswald,sans-serif;font-size:15px;font-weight:600;padding:0;
}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.seg button.s-present[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.seg button.s-late[aria-pressed="true"]{background:var(--info);border-color:var(--info);color:#fff}
.seg button.s-excused[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button.s-absent[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"],
:root:not([data-theme="light"]) .seg button.s-late[aria-pressed="true"]{color:var(--on-accent)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:var(--on-accent)}
}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-3);padding:0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.tally b{font-family:Oswald,sans-serif;font-weight:600}
.actionbar{
  position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));z-index:20;
  padding:10px;margin:14px -4px 0;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(8px);border-radius:var(--r);
}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:13px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:Oswald,sans-serif;font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.seglist{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seglist button{
  flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--ink-3);min-height:38px;
}
.seglist button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.prow{display:flex;align-items:center;gap:12px;padding:11px 13px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.prow-name{font-size:15px;font-weight:600;line-height:1.25}
.bar{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-present{background:var(--accent)}
.bar .b-late{background:var(--info)}
.bar .b-excused{background:var(--warn)}
.bar .b-absent{background:var(--bad)}
.prow-num{font-family:Oswald,sans-serif;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;flex:none;width:62px;text-align:right}
.prow-sub{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.whoami{padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.whoami span{font-size:14px}
.pickcoach{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 20px;gap:6px}
.pickcoach p{margin:0 0 10px}

.avlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.avitem{border-top:1px solid var(--line);padding:11px 13px 13px;display:flex;flex-direction:column;gap:10px}
.avitem:first-child{border-top:0}
.avhead{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;width:100%}
.avhead b{font-size:15px}
.avhead span{font-size:12px;color:var(--ink-3)}
.avtally{
  display:flex;gap:14px;background:none;border:0;padding:0;font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;width:100%;text-align:left;color:inherit;
}
.avtally span{display:inline-flex;align-items:center;gap:5px}
.avtally .t-yes{color:var(--accent)}
.avtally .t-maybe{color:var(--warn)}
.avtally .t-no{color:var(--bad)}
.avbtns{display:flex;gap:6px}
.avbtns button{
  flex:1;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:9px;
  padding:9px 6px;font-size:17px;min-height:42px;
}
.avbtns button.yes[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.avbtns button.maybe[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.avbtns button.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.avgroup{margin-top:14px}
.avgroup h3{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.avnames{display:flex;flex-direction:column;gap:2px;font-size:14px}
.avnames .why{color:var(--ink-3);font-size:12px}
.avempty{font-size:13px;color:var(--ink-3);padding:2px 0}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;font-size:14px}
table.grid th,table.grid td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
table.grid td.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- admin ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs button{
  flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;
  padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink-2);min-height:40px;
}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow b{font-size:15px}
.item.off .grow{opacity:.55}
.formgrid{display:flex;flex-wrap:wrap;gap:10px}
.formgrid > *{flex:1 1 140px}
.dlg{border:0;padding:0;background:none;max-width:100%}
.dlg::backdrop{background:rgba(8,14,11,.55)}
.dlg-in{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;width:min(440px,calc(100vw - 32px));box-shadow:var(--shadow);color:var(--ink)}

/* ---------- PIN-Sperre ---------- */
.lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.lock-card{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.lock-mark{
  width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;font-family:Oswald,sans-serif;font-size:26px;font-weight:600;
}
.lock-title{font-family:Oswald,sans-serif;font-size:22px;font-weight:600;line-height:1.2}
.lock-sub{font-size:14px;color:var(--ink-3);margin-top:-12px}
.dots{display:flex;gap:12px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);display:block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.lock.bad .dots i{border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){ .lock.bad .dots{animation:shake .32s} }
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.keys button{
  height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:Oswald,sans-serif;font-size:24px;font-weight:500;box-shadow:var(--shadow);
}

      <button type="button" class="btn btn-danger" data-act="reasonok">Absagen</button>
    </div>
  </div>
</dialog>
<script src="config.js"></script>
<script id="app-code">

(function(){
"use strict";

/* ===================== Konstanten ===================== */
var TITLE = "Trainingspräsenz";
var DOW = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var DOW_S = ["So","Mo","Di","Mi","Do","Fr","Sa"];
var MON_S = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
var STATUS = [
  {k:"present", ab:"A", label:"Anwesend",      cls:"s-present", color:"var(--accent)"},
  {k:"late",    ab:"V", label:"Verspätet",     cls:"s-late",    color:"var(--info)"},
  {k:"excused", ab:"E", label:"Entschuldigt",  cls:"s-excused", color:"var(--warn)"},
  {k:"absent",  ab:"F", label:"Fehlt",         cls:"s-absent",  color:"var(--bad)"}
];
var SK = {}; STATUS.forEach(function(s){ SK[s.k] = s; });
var ICON = {
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  cog:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 7.5l2 1.2M17.5 15.3l2 1.2M4.5 16.5l2-1.2M17.5 8.7l2-1.2"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5.2 5.2L20 7"/></svg>',
  pen:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.4 2.4 0 0 0-3.4-3.4L4.6 16.6 4 20z"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.6h6V7M6.5 7l.8 13h9.4l.8-13"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 5l-7 7 7 7"/></svg>',
  plan:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2.5"/><path d="M8 2.6v3M16 2.6v3M4 9.5h16"/><path d="M8.3 14l2 2 4.6-4.8"/></svg>'
};

/* ===================== Zustand ===================== */
var CFG = window.TP_CONFIG || {};
var TEAMS = Array.isArray(CFG.teams) ? CFG.teams : [];
var TEAM = null;         // gewaehltes Team (Objekt aus TEAMS) - null vor der Team-Auswahl
var DB = null;           // wird nach der PIN-Eingabe vom Server geladen
var REV = 0;             // Stand des Datenbestands (verhindert Überschreiben)
var PIN = "";            // App-PIN dieser Sitzung
var SHEETURL = "";       // Adresse der Google-Tabelle
var UI = {view:"events", occ:null, statType:"all", statRange:"season", statSort:"quote", adminTab:"players"};
var RO = false;          // Nur-Lese-Modus (in dieser Fassung nicht verwendet)
var UNLOCKED = false;    // App-PIN eingegeben und Daten geladen
var ADMIN_OK = false;    // Admin-PIN eingegeben
var PINBUF = "";
var BUSY = false;
var LOADING = false;
var FAIL = null;         // Text des letzten Verbindungsfehlers
var PLAN_DECLINE = null; // {occ, coach} waehrend der Absagegrund-Dialog offen ist

try {
  var savedUI = sessionStorage.getItem("tp.ui");
  if (savedUI) { var p = JSON.parse(savedUI); for (var k in p) UI[k] = p[k]; }
} catch(e){}

function normalize(d){
  if (!d || typeof d !== "object") d = {};
  d.v = 1;
  d.settings = d.settings || {};
  ["team","season","seasonStart","seasonEnd","pin","adminPin"].forEach(function(k){ d.settings[k] = d.settings[k] || ""; });
  ["coaches","players","rules","singles","records"].forEach(function(k){ if (!Array.isArray(d[k])) d[k] = []; });
  d.players.forEach(function(p){ delete p.birth; });   // Geburtsdaten werden bewusst nicht gespeichert
  if (!d.availability || typeof d.availability !== "object" || Array.isArray(d.availability)) d.availability = {};
  return d;
}

/* ===================== Hilfsfunktionen ===================== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(p){ return p + "-" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseISO(s){
  if (!s) return null;
  var a = String(s).split("-");
  if (a.length !== 3) return null;
  var d = new Date(+a[0], +a[1]-1, +a[2]);
  return isNaN(d.getTime()) ? null : d;
}
function todayISO(){ return iso(new Date()); }
function addDays(isoStr, n){ var d = parseISO(isoStr); d.setDate(d.getDate()+n); return iso(d); }
function dowOf(isoStr){ var d = parseISO(isoStr); return d ? d.getDay() : 0; }
function fmtDate(isoStr){
  var d = parseISO(isoStr); if (!d) return isoStr || "";
  return DOW[d.getDay()] + ", " + d.getDate() + ". " + MON_S[d.getMonth()] + " " + d.getFullYear();
}
function fmtShort(isoStr){
  var d = parseISO(isoStr); if (!d) return isoStr || "";
  return DOW_S[d.getDay()] + " " + pad(d.getDate()) + "." + pad(d.getMonth()+1) + "." + String(d.getFullYear()).slice(2);
}
function fullName(p){ return ((p.first || "") + " " + (p.last || "")).trim(); }
function sortName(a,b){
  var x = ((a.last||"") + " " + (a.first||"")).toLowerCase();
  var y = ((b.last||"") + " " + (b.first||"")).toLowerCase();
  return x < y ? -1 : x > y ? 1 : 0;
}
function byId(list, id){ for (var i=0;i<list.length;i++) if (list[i].id === id) return list[i]; return null; }
function pct(n, d){ return d > 0 ? Math.round((n/d)*100) : 0; }
function typeLabel(t){ return t === "match" ? "Wettkampf" : "Training"; }
function el(id){ return document.getElementById(id); }
function timeRange(o){
  if (!o.time) return "";
  return o.timeEnd ? o.time + "\u2013" + o.timeEnd + " Uhr" : o.time + " Uhr";
}

/* ===================== Verbindung zum Server ===================== */
function configured(){ return !!(TEAM && TEAM.apiUrl && /^https?:\/\//.test(TEAM.apiUrl) && TEAM.apiUrl.indexOf("HIER") < 0); }

async function apiCall(payload){
  if (!configured()) throw {error:"noconfig"};
  // Zeitlimit, damit eine haengende Verbindung nicht ewig "Bitte warten" zeigt
  var stop = null, signal;
  try { var ac = new AbortController(); signal = ac.signal; stop = setTimeout(function(){ ac.abort(); }, 30000); } catch(e){}
  var res;
  try {
    res = await fetch(TEAM.apiUrl, {
      method: "POST",
      // text/plain vermeidet die Vorabanfrage, die Google-Skripte nicht beantworten
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      signal: signal
    });
  } catch(err) {
    if (stop) clearTimeout(stop);
    throw (err && err.name === "AbortError") ? {error:"timeout"} : {error:"network"};
  }
  if (stop) clearTimeout(stop);
  if (!res.ok) throw {error:"http", status: res.status};
  var data = await res.json();
  if (!data || typeof data !== "object") throw {error:"bad_response"};
  return data;
}
function apiLoad(pin){ return apiCall({action:"load", pin:pin}); }
function apiSave(pin, state, rev){ return apiCall({action:"save", pin:pin, state:state, rev:rev}); }

function failText(err){
  var e = err && err.error;
  if (e === "noconfig") return "Für dieses Team ist noch keine Google-Tabelle verbunden – in docs/config.js fehlt die Adresse des Skripts (siehe SETUP.md).";
  if (e === "http") return "Der Server hat mit Fehler " + err.status + " geantwortet. Ist das Skript als Web-App für «alle» freigegeben?";
  if (e === "busy") return "Gerade speichert jemand anderes. Bitte in ein paar Sekunden nochmals versuchen.";
  if (e === "timeout") return "Der Server antwortet nicht. Das Mobilfunknetz ist vielleicht zu langsam – bitte nochmals versuchen.";
  if (e === "too_large") return "Die Datenmenge ist zu gross. Bitte Rücksprache halten.";
  if (e === "bad_state") return "Die Daten konnten nicht gespeichert werden (unerwartetes Format). Bitte die Seite neu laden.";
  if (e === "nopin") return "Im Google-Skript ist noch kein PIN gesetzt. Trage oben in der Datei Code.gs bei ERSTER_PIN einen PIN ein (siehe SETUP.md).";
  return "Keine Verbindung zum Server. Internetverbindung prüfen und nochmals versuchen.";
}

function toast(msg){
  var old = document.querySelector(".toast"); if (old) old.remove();
  var t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.remove(); }, 4200);
}

async function boot(pin){
  if (!TEAM || !pin) { render(); return false; }
  LOADING = true; FAIL = null; render();
  try {
    var r = await apiLoad(pin);
    LOADING = false;
    if (!r.ok) {
      if (r.error === "pin") {
        PINBUF = "";
        setStoredPin(TEAM.id, "");
        render(); shake(); toast("Falscher PIN.");
        return false;
      }
      FAIL = r.message || failText({error: r.error}); render(); return false;
    }
    DB = normalize(r.state);
    REV = Number(DB.rev || 0);
    PIN = pin;
    SHEETURL = r.sheetUrl || "";
    UNLOCKED = true;
    PINBUF = "";
    setStoredPin(TEAM.id, pin);
    checkAdmin();
    render();
    return true;
  } catch(err) {
    LOADING = false; FAIL = failText(err); render(); return false;
  }
}

async function refresh(){
  if (!UNLOCKED || BUSY || LOADING || UI.view === "record") return;
  try {
    var r = await apiLoad(PIN);
    if (r.ok && Number(r.state.rev || 0) !== REV) {
      DB = normalize(r.state); REV = Number(DB.rev || 0); render();
      toast("Daten wurden auf den aktuellen Stand gebracht.");
    }
  } catch(err){ /* stiller Fehlschlag - der naechste Versuch folgt */ }
}

async function commit(mutate, msg, nextUI){
  if (BUSY) return false;
  var backup = JSON.stringify(DB);
  BUSY = true;
  try { mutate(DB); } catch(e){ BUSY = false; DB = JSON.parse(backup); throw e; }
  render();
  try {
    var r = await apiSave(PIN, DB, REV);
    BUSY = false;
    if (r.ok) {
      REV = Number(r.rev || REV + 1); DB.rev = REV;
      if (nextUI) for (var k in nextUI) UI[k] = nextUI[k];
      render();
      if (msg) toast(msg);
      return true;
    }
    if (r.error === "conflict" && r.state) {
      DB = normalize(r.state); REV = Number(DB.rev || 0); render();
      toast("Jemand anderes hat zuerst gespeichert. Der aktuelle Stand ist jetzt geladen – bitte nochmals eintragen.");
      return false;
    }
    if (r.error === "pin") {
      DB = JSON.parse(backup); UNLOCKED = false; PINBUF = "";
      try { if (TEAM) localStorage.removeItem("tp.pin." + TEAM.id); } catch(e){}
      render(); toast("Der PIN wurde geändert. Bitte neu anmelden.");
      return false;
    }
    DB = JSON.parse(backup); render(); toast(r.message || failText({error: r.error}));
    return false;
  } catch(err) {
    DB = JSON.parse(backup); BUSY = false; render();
    toast(failText(err));
    return false;
  }
}

/**
 * Speichert eine einzelne Zu-/Absage. Nutzt denselben Speicherweg wie commit(),
 * wiederholt bei einem Konflikt (jemand anderes war schneller) EINMAL
 * automatisch auf dem frischen Stand - sicher, weil eine Zu-/Absage nur eine
 * einzelne, von anderen Aenderungen unabhaengige Stelle im Datenbestand
 * betrifft. commit() selbst bleibt dafuer unveraendert (dort waere ein
 * automatisches Wiederholen bei z.B. einer Notiz riskant, weil zwei Leute
 * dieselbe Stelle unterschiedlich geaendert haben koennten).
 */
async function commitAvailability(occId, coachId, status, reason){
  if (BUSY) return false;
  var mutate = function(db){
    if (status === "pending") {
      if (db.availability[occId]) {
        delete db.availability[occId][coachId];
        if (!Object.keys(db.availability[occId]).length) delete db.availability[occId];
      }
    } else {
      db.availability[occId] = db.availability[occId] || {};
      db.availability[occId][coachId] = (status === "declined") ? {status: status, reason: reason || ""} : {status: status};
    }
  };
  var attempt = async function(){
    var backup = JSON.stringify(DB);
    BUSY = true;
    mutate(DB);
    render();
    try {
      var r = await apiSave(PIN, DB, REV);
      BUSY = false;
      if (r.ok) { REV = Number(r.rev || REV + 1); DB.rev = REV; render(); return "ok"; }
      if (r.error === "conflict" && r.state) {
        DB = normalize(r.state); REV = Number(DB.rev || 0);
        return "retry";
      }
      if (r.error === "pin") {
        DB = JSON.parse(backup); UNLOCKED = false; PINBUF = "";
        try { if (TEAM) localStorage.removeItem("tp.pin." + TEAM.id); } catch(e){}
        render(); toast("Der PIN wurde geändert. Bitte neu anmelden.");
        return "fail";
      }
      DB = JSON.parse(backup); render(); toast(r.message || failText({error: r.error}));
      return "fail";
    } catch(err) {
      DB = JSON.parse(backup); BUSY = false; render();
      toast(failText(err));
      return "fail";
    }
  };
  var res = await attempt();
  if (res === "retry") res = await attempt();
  if (res === "retry") { render(); toast("Kurz nochmals versuchen – der Server ist gerade beschäftigt."); return false; }
  return res === "ok";
}

/* ===================== Datei-Download ===================== */
function download(filename, text, mime){
  try {
    var blob = new Blob([text], {type: mime || "text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
    return true;
  } catch(e){ toast("Der Browser hat den Download blockiert."); return false; }
}

/* ===================== Termine / Vorkommen ===================== */
function seasonFrom(){ return DB.settings.seasonStart || addDays(todayISO(), -180); }
function seasonTo(){ return DB.settings.seasonEnd || addDays(todayISO(), 120); }

function plannedOccurrences(fromISO, toISO){
  var out = [], i;
  var lo = fromISO, hi = toISO;
  if (lo > hi) return out;
  for (i = 0; i < DB.rules.length; i++) {
    var r = DB.rules[i];
    if (r.active === false) continue;
    var s = r.from && r.from > lo ? r.from : lo;
    var e = r.to && r.to < hi ? r.to : hi;
    if (s > e) continue;
    var d = parseISO(s), guard = 0;
    while (d.getDay() !== Number(r.weekday) && guard++ < 7) d.setDate(d.getDate()+1);
    while (iso(d) <= e && guard++ < 800) {
      out.push({id: r.id + "|" + iso(d), date: iso(d), time: r.time || "", timeEnd: r.timeEnd || "", type: r.type, label: r.label || "", ruleId: r.id});
      d.setDate(d.getDate()+7);
    }
  }
  for (i = 0; i < DB.singles.length; i++) {
    var g = DB.singles[i];
    if (g.date >= lo && g.date <= hi) out.push({id: g.id, date: g.date, time: g.time || "", timeEnd: g.timeEnd || "", type: g.type, label: g.label || "", singleId: g.id});
  }
  return out;
}
function recordFor(occId){ return byId(DB.records, occId); }
function sortByDate(a, b){
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  return (a.time || "") < (b.time || "") ? -1 : (a.time || "") > (b.time || "") ? 1 : 0;
}

/* --- lokaler Entwurf (nur auf diesem Gerät) --- */
function draftKey(id){ return "tp.draft." + id; }
function loadDraft(id){
  try { var s = localStorage.getItem(draftKey(id)); return s ? JSON.parse(s) : null; } catch(e){ return null; }
}
function saveDraft(id, d){ try { localStorage.setItem(draftKey(id), JSON.stringify(d)); } catch(e){} }
function clearDraft(id){ try { localStorage.removeItem(draftKey(id)); } catch(e){} }

function activePlayers(){ return DB.players.filter(function(p){ return p.active !== false; }).sort(sortName); }
function activeCoaches(){ return DB.coaches.filter(function(c){ return c.active !== false; }).sort(sortName); }

/* ===================== Trainer-Planung ===================== */
function storedCoach(){ try { return (TEAM && localStorage.getItem("tp.coach." + TEAM.id)) || ""; } catch(e){ return ""; } }
function setStoredCoach(id){ try { if (!TEAM) return; if (id) localStorage.setItem("tp.coach." + TEAM.id, id); else localStorage.removeItem("tp.coach." + TEAM.id); } catch(e){} }
function myCoachId(){
  var id = UI.myCoach || storedCoach();
  if (id && !byId(DB.coaches, id)) id = "";           // Trainer wurde geloescht
  return id;
}
function planOccurrences(){
  return plannedOccurrences(todayISO(), seasonTo())
    .filter(function(o){ return o.date >= todayISO(); })
    .sort(sortByDate);
}
function availabilityFor(occId, coachId){
  var a = DB.availability[occId] && DB.availability[occId][coachId];
  return (a && a.status) ? a : {status: "pending"};
}
function pendingCountFor(coachId){
  if (!coachId) return 0;
  var n = 0;
  planOccurrences().forEach(function(o){ if (availabilityFor(o.id, coachId).status === "pending") n++; });
  return n;
}
function confirmedCoachIds(occId){
  // Schlaegt beim Start einer neuen Erfassung die Trainer vor, die zugesagt
  // haben - reine Vorbelegung eines noch ungespeicherten Entwurfs, veraendert
  // nie eine bereits bestehende Erfassung oder einen laufenden Entwurf.
  var a = DB.availability[occId]; if (!a) return [];
  return activeCoaches().filter(function(c){ return a[c.id] && a[c.id].status === "confirmed"; }).map(function(c){ return c.id; });
}
function tallyFor(occId){
  var t = {confirmed: 0, uncertain: 0, declined: 0};
  var a = DB.availability[occId];
  if (a) for (var cid in a) { var st = a[cid] && a[cid].status; if (t[st] !== undefined) t[st]++; }
  return t;
}

/* ===================== Ansicht: Termine ===================== */
function viewEvents(){
  var today = todayISO(), h = "";
  var planned = plannedOccurrences(seasonFrom(), addDays(today, 21)).filter(function(o){ return !recordFor(o.id); });
  var upcoming = planned.filter(function(o){ return o.date >= today; }).sort(sortByDate);
  var missing  = planned.filter(function(o){ return o.date < today; }).sort(sortByDate).reverse();
  var done     = DB.records.slice().sort(sortByDate).reverse();

  if (!DB.players.length || (!DB.rules.length && !DB.singles.length && !DB.records.length)) {
    h += '<div class="card empty" style="margin-bottom:14px"><b>Willkommen</b>'
      + 'Lege im Bereich <strong>Admin</strong> zuerst die Spieler, die Trainer und die Trainings- bzw. Wettkampftage an. '
      + 'Danach erscheinen hier alle Termine zum Erfassen.'
      + '<div style="margin-top:14px"><button class="btn btn-primary" data-act="go" data-view="admin">Zum Admin-Bereich</button></div></div>';
  }

  h += '<div class="eyebrow">Heute &amp; demnächst</div>';
  h += upcoming.length ? '<div class="stack">' + upcoming.slice(0,8).map(function(o){ return evCard(o, null, today); }).join("") + "</div>"
     : '<div class="card empty">Keine geplanten Termine in den nächsten drei Wochen.</div>';

  if (missing.length) {
    h += '<div class="eyebrow">Nachzutragen</div><div class="stack">'
      + missing.slice(0,25).map(function(o){ return evCard(o, null, today); }).join("") + "</div>";
  }

  h += '<div class="eyebrow">Erfasst</div>';
  h += done.length ? '<div class="stack">' + done.slice(0,60).map(function(r){ return evCard(r, r, today); }).join("") + "</div>"
     : '<div class="card empty">Noch keine abgeschlossene Anwesenheitserfassung.</div>';

  h += '<div style="margin-top:18px"><button class="btn btn-block" data-act="adhoc">+ Termin ausserhalb des Plans erfassen</button></div>';
  return h;
}

function evCard(o, rec, today){
  var d = parseISO(o.date);
  var late = !rec && o.date < today;
  var cls = "ev" + (late ? " is-late" : "") + (o.date === today ? " is-today" : "");
  var right;
  if (rec) {
    var n = 0, tot = 0;
    for (var k in rec.entries) { tot++; if (rec.entries[k] === "present" || rec.entries[k] === "late") n++; }
    right = '<span class="ev-quote">' + n + "/" + tot + "</span>";
  } else {
    right = loadDraft(o.id) ? '<span class="pill pill-open">Entwurf</span>' : ICON.chev;
  }
  var coaches = rec ? (rec.coachIds || []).map(function(id){
        var c = byId(DB.coaches, id); return c ? fullName(c) : null;
      }).filter(Boolean).join(", ") : "";
  var meta = [];
  if (o.time) meta.push('<span>' + esc(timeRange(o)) + "</span>");
  if (rec) meta.push('<span>' + (coaches ? esc(coaches) : '<em>kein Trainer erfasst</em>') + "</span>");
  else if (late) meta.push('<span style="color:var(--warn);font-weight:600">nicht erfasst</span>');

  return '<button class="' + cls + '" data-act="open" data-occ="' + esc(o.id) + '">'
    + '<span class="ev-date"><span class="ev-dow">' + DOW_S[d.getDay()] + "</span>"
    + '<span class="ev-day">' + d.getDate() + "</span>"
    + '<span class="ev-mon">' + MON_S[d.getMonth()] + "</span></span>"
    + '<span class="ev-body"><span class="ev-title">' + esc(o.label || typeLabel(o.type)) + "</span>"
    + '<span class="ev-meta"><span class="pill ' + (o.type === "match" ? "pill-match" : "pill-training") + '">' + typeLabel(o.type) + "</span>"
    + meta.join("") + "</span></span>"
    + '<span class="ev-side">' + right + "</span></button>";
}

/* ===================== Ansicht: Anwesenheit erfassen ===================== */
function findOccurrence(id){
  var rec = recordFor(id);
  if (rec) return {id: rec.id, date: rec.date, time: rec.time, timeEnd: rec.timeEnd || "", type: rec.type, label: rec.label, rec: rec};
  var all = plannedOccurrences(addDays(todayISO(), -800), addDays(todayISO(), 800));
  for (var i=0;i<all.length;i++) if (all[i].id === id) return all[i];
  if (UI.adhoc && UI.adhoc.id === id) return UI.adhoc;
  return null;
}

function viewRecord(){
  var occ = findOccurrence(UI.occ);
  if (!occ) return '<div class="card empty"><b>Termin nicht gefunden</b>Der Termin wurde im Admin-Bereich verändert oder gelöscht.</div>';
  var rec = occ.rec || null;
  var draft = loadDraft(occ.id);
  var state = draft || (rec ? {entries: Object.assign({}, rec.entries), coachIds: (rec.coachIds || []).slice(), note: rec.note || ""}
                            : {entries: {}, coachIds: confirmedCoachIds(occ.id), note: ""});
  UI.state = state;

  var players = activePlayers();
  if (rec) { // auch inaktive Spieler zeigen, die in dieser Erfassung enthalten sind
    DB.players.forEach(function(p){

  var h = '<div class="card sheet-head">'

    + (rec ? '<span class="pill pill-done">abgeschlossen</span>' : "")
    + (draft && !rec ? '<span class="pill pill-open">Entwurf auf diesem Gerät</span>' : "") + "</div>"
    + '<div class="sheet-title">' + esc(occ.label || typeLabel(occ.type)) + "</div>"
    + '<div class="muted small">' + fmtDate(occ.date) + (occ.time ? " &middot; " + esc(timeRange(occ)) : "") + "</div>"
    + "</div>";

  h += '<div class="eyebrow">Anwesende Trainer</div>';
  if (!coaches.length) {
    h += '<div class="card empty">Noch keine Trainer erfasst. <button class="btn btn-sm" data-act="go" data-view="admin" data-tab="coaches" style="margin-top:10px">Trainer anlegen</button></div>';
  } else {
    h += '<div class="wrap">' + coaches.map(function(c){
      var on = state.coachIds.indexOf(c.id) >= 0;
      return '<button class="coach" data-act="coach" data-id="' + c.id + '" aria-pressed="' + on + '">'
        + (on ? ICON.check : "") + esc(fullName(c)) + (c.role ? ' <span class="muted small">' + esc(c.role) + "</span>" : "") + "</button>";
    }).join("") + "</div>";
  }

  h += '<div class="eyebrow">Spieler <span class="muted" style="text-transform:none;letter-spacing:0;font-family:inherit">(' + players.length + ")</span></div>";
  if (!players.length) {
    h += '<div class="card empty">Noch keine Spieler erfasst. <button class="btn btn-sm" data-act="go" data-view="admin" data-tab="players" style="margin-top:10px">Spieler anlegen</button></div>';
  } else {
    h += '<div class="wrap" style="margin-bottom:10px">'
      + '<button class="btn btn-sm" data-act="all" data-status="present">Alle anwesend</button>'
      + '<button class="btn btn-sm" data-act="all" data-status="">Zurücksetzen</button></div>';
    h += '<div class="card"><ul class="plist">' + players.map(function(p){
      return '<li data-player="' + p.id + '"><span class="pname"><b>' + esc(p.first) + "</b> " + esc(p.last)
        + (p.active === false ? ' <small>nicht mehr im Kader</small>' : "") + "</span>"
        + '<span class="seg">' + STATUS.map(function(s){
            var on = state.entries[p.id] === s.k;
            return '<button class="' + s.cls + '" data-act="mark" data-player="' + p.id + '" data-status="' + s.k + '" '
              + 'aria-pressed="' + on + '" aria-label="' + s.label + " – " + esc(fullName(p)) + '" title="' + s.label + '">' + s.ab + "</button>";
          }).join("") + "</span></li>";
    }).join("") + "</ul></div>";
    h += '<div class="legend" style="margin-top:8px">' + STATUS.map(function(s){
      return '<span><i style="background:' + s.color + '"></i>' + s.ab + " &middot; " + s.label + "</span>";
    }).join("") + "</div>";

function tallyHtml(state, total){
  var counts = {present:0, late:0, excused:0, absent:0}, set = 0;
  for (var k in state.entries) { if (counts[state.entries[k]] !== undefined) { counts[state.entries[k]]++; set++; } }
  var here = counts.present + counts.late;
  return '<div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap">'
    + '<span class="tally">' + STATUS.map(function(s){
        return '<span class="pill" style="background:var(--surface-2);color:var(--ink-2)"><i style="width:9px;height:9px;border-radius:3px;display:inline-block;background:' + s.color + '"></i>' + s.label + ' <b>' + counts[s.k] + "</b></span>";
      }).join("") + "</span>"
    + '<span class="disp tnum" style="font-size:20px">' + here + "/" + total + " anwesend</span></div>"
    + (set < total ? '<p class="small muted" style="margin:8px 0 0">' + (total - set) + " Spieler noch ohne Eintrag – ohne Eintrag zählt der Spieler für diesen Termin nicht in die Statistik.</p>" : "");
}

/* ===================== Ansicht: Auswertung ===================== */
function statRecords(){
  var recs = DB.records.slice();
  if (UI.statType !== "all") recs = recs.filter(function(r){ return r.type === UI.statType; });
  if (UI.statRange !== "season") {
    var days = UI.statRange === "30" ? 30 : 90;
    var lim = addDays(todayISO(), -days);
    recs = recs.filter(function(r){ return r.date >= lim; });
  } else {
    var s = DB.settings.seasonStart, e = DB.settings.seasonEnd;
    if (s) recs = recs.filter(function(r){ return r.date >= s; });
    if (e) recs = recs.filter(function(r){ return r.date <= e; });
  }
  return recs.sort(sortByDate);
}
function playerStats(recs){
  var map = {};
  DB.players.forEach(function(p){ map[p.id] = {p:p, present:0, late:0, excused:0, absent:0, total:0}; });
  recs.forEach(function(r){
    for (var pid in r.entries) {
      var st = r.entries[pid];
      if (!map[pid]) { var pl = byId(DB.players, pid); if (!pl) continue; map[pid] = {p:pl, present:0, late:0, excused:0, absent:0, total:0}; }
      if (map[pid][st] === undefined) continue;
      map[pid][st]++; map[pid].total++;
    }
  });
  var arr = [];
  for (var k in map) { var s = map[k]; s.here = s.present + s.late; s.quote = pct(s.here, s.total); arr.push(s); }
  return arr;
}

function viewStats(){
  var recs = statRecords();
  var stats = playerStats(recs).filter(function(s){ return s.total > 0 || s.p.active !== false; });
  if (UI.statSort === "quote") stats.sort(function(a,b){ return b.quote - a.quote || sortName(a.p, b.p); });
  else stats.sort(function(a,b){ return sortName(a.p, b.p); });

  var sumHere = 0, sumTot = 0;
  stats.forEach(function(s){ sumHere += s.here; sumTot += s.total; });
  var nTrain = recs.filter(function(r){ return r.type === "training"; }).length;
  var nMatch = recs.filter(function(r){ return r.type === "match"; }).length;

  var h = '<div class="seglist" style="margin-bottom:10px">'
    + [["all","Alle"],["training","Training"],["match","Wettkampf"]].map(function(o){
        return '<button data-act="stype" data-v="' + o[0] + '" aria-pressed="' + (UI.statType === o[0]) + '">' + o[1] + "</button>";
      }).join("") + "</div>"
    + '<div class="seglist">'
    + [["season","Ganze Saison"],["90","90 Tage"],["30","30 Tage"]].map(function(o){
        return '<button data-act="srange" data-v="' + o[0] + '" aria-pressed="' + (UI.statRange === o[0]) + '">' + o[1] + "</button>";
      }).join("") + "</div>";

  h += '<div class="eyebrow">Überblick</div><div class="kpis">'
    + kpi(pct(sumHere, sumTot) + "%", "Gesamtquote")
    + kpi(recs.length, "Erfasste Termine")
    + kpi(nTrain, "Trainings")
    + kpi(nMatch, "Wettkämpfe") + "</div>";

  h += '<div class="eyebrow">Anwesenheit pro Spieler<button class="btn btn-sm" data-act="ssort" style="margin-left:4px">'
    + (UI.statSort === "quote" ? "Nach Quote" : "Nach Name") + "</button></div>";
  if (!stats.length || !sumTot) {
    h += '<div class="card empty"><b>Noch keine Daten</b>Sobald eine Anwesenheit abgeschlossen ist, erscheint hier die Auswertung.</div>';
  } else {
    h += '<div class="card">' + stats.map(function(s){
      var seg = STATUS.map(function(st){
        var w = s.total ? (s[st.k] / s.total) * 100 : 0;
        return w > 0 ? '<i class="b-' + st.k + '" style="width:' + w + '%"></i>' : "";
      }).join("");
      return '<div class="prow"><div class="prow-main">'
        + '<span class="prow-name">' + esc(s.p.first) + " " + esc(s.p.last) + (s.p.active === false ? ' <span class="muted small">(inaktiv)</span>' : "") + "</span>"
        + '<span class="bar">' + seg + "</span>"
        + '<span class="prow-sub">' + s.here + " von " + s.total + " &middot; A " + s.present + " &middot; V " + s.late + " &middot; E " + s.excused + " &middot; F " + s.absent + "</span>"
        + '</div><span class="prow-num">' + s.quote + "%</span></div>";
    }).join("") + "</div>";
    h += '<div class="legend" style="margin-top:8px">' + STATUS.map(function(st){
      return '<span><i style="background:' + st.color + '"></i>' + st.label + "</span>";
    }).join("") + '<span class="muted">Quote = (Anwesend + Verspätet) / erfasste Termine</span></div>';
  }

  var cstats = activeCoaches().map(function(c){
    return {c:c, n: recs.filter(function(r){ return (r.coachIds || []).indexOf(c.id) >= 0; }).length};
  }).sort(function(a,b){ return b.n - a.n; });
  if (cstats.length) {
    h += '<div class="eyebrow">Trainereinsätze</div><div class="card">' + cstats.map(function(s){
      return '<div class="item"><span class="grow"><b>' + esc(fullName(s.c)) + "</b>"
        + (s.c.role ? ' <span class="muted small">' + esc(s.c.role) + "</span>" : "") + "</span>"
        + '<span class="disp tnum" style="font-size:18px">' + s.n + "</span></div>";
    }).join("") + "</div>";
  }

  h += '<div class="eyebrow">Einzelne Termine</div>';
  if (recs.length) {
    h += '<div class="card tblwrap"><table class="grid"><thead><tr><th>Datum</th><th>Art</th><th>Trainer</th><th class="num">Anwesend</th><th class="num">Quote</th></tr></thead><tbody>'
      + recs.slice().reverse().map(function(r){
          var here = 0, tot = 0;
          for (var k in r.entries) { tot++; if (r.entries[k] === "present" || r.entries[k] === "late") here++; }
          var cn = (r.coachIds || []).map(function(id){ var c = byId(DB.coaches, id); return c ? (c.first ? c.first.charAt(0) + ". " : "") + c.last : null; }).filter(Boolean).join(", ");
          return "<tr><td>" + fmtShort(r.date) + "</td><td>" + typeLabel(r.type) + "</td><td>" + (esc(cn) || "&ndash;")
            + '</td><td class="num">' + here + "/" + tot + '</td><td class="num">' + pct(here, tot) + "%</td></tr>";
        }).join("") + "</tbody></table></div>";
  } else {
    h += '<div class="card empty">Keine Termine im gewählten Zeitraum.</div>';
  }

  h += '<div class="stack-s" style="margin-top:18px">'
    + '<button class="btn btn-primary btn-block" data-act="report">Bericht &amp; Druckansicht (PDF)</button>'
    + '<button class="btn btn-block" data-act="export">Für Excel exportieren (CSV)</button></div>';
  return h;
}
function kpi(v, l){ return '<div class="card kpi"><b>' + v + "</b><span>" + l + "</span></div>"; }

function exportCsv(){
  var recs = statRecords(), stats = playerStats(recs).sort(function(a,b){ return sortName(a.p, b.p); });
  var sep = ";", nl = "\r\n";
  function q(v){
    v = String(v == null ? "" : v);
    if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;   // Formel-Ausfuehrung in Excel verhindern
    return /[";\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  var lines = [];
  lines.push([q("Team"), q(DB.settings.team || "")].join(sep));
  lines.push([q("Saison"), q(DB.settings.season || "")].join(sep));
  lines.push([q("Export"), q(fmtDate(todayISO()))].join(sep));
  lines.push("");
  lines.push(["Vorname","Nachname","Quote %","Anwesend","Verspätet","Entschuldigt","Fehlt","Erfasste Termine"].map(q).join(sep));
  stats.forEach(function(s){
    lines.push([s.p.first, s.p.last, s.quote, s.present, s.late, s.excused, s.absent, s.total].map(q).join(sep));
  });
  lines.push("");
  lines.push(["Datum","Wochentag","Uhrzeit","Art","Bezeichnung","Trainer","Anwesend","Erfasst","Notiz"].map(q).join(sep));
  recs.forEach(function(r){
    var here = 0, tot = 0;
    for (var k in r.entries) { tot++; if (r.entries[k] === "present" || r.entries[k] === "late") here++; }
    var cn = (r.coachIds || []).map(function(id){ var c = byId(DB.coaches, id); return c ? fullName(c) : null; }).filter(Boolean).join(", ");
    lines.push([r.date, DOW[dowOf(r.date)], r.time || "", typeLabel(r.type), r.label || "", cn, here, tot, r.note || ""].map(q).join(sep));
  });
  lines.push("");
  lines.push(["Matrix: Spieler x Termin (A=Anwesend, V=Verspätet, E=Entschuldigt, F=Fehlt)"].map(q).join(sep));
  lines.push(["Vorname","Nachname"].concat(recs.map(function(r){ return fmtShort(r.date) + " " + (r.type === "match" ? "W" : "T"); })).map(q).join(sep));
  stats.forEach(function(s){
    lines.push([s.p.first, s.p.last].concat(recs.map(function(r){
      var st = r.entries[s.p.id]; return st ? SK[st].ab : "";
    })).map(q).join(sep));
  });
  var csv = "﻿" + lines.join(nl);
  var base = "anwesenheit-" + (DB.settings.team || "team").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + todayISO();
  if (download(base + ".csv", csv, "text/csv;charset=utf-8")) toast("CSV gespeichert.");
}

function adminPlan(){

    + '<p class="small muted" style="margin:-4px 0 10px">Jede Serie erzeugt automatisch alle Termine der Saison – Training oder Wettkampf.</p>';
  var rules = DB.rules.slice().sort(function(a,b){ return (a.weekday - b.weekday) || ((a.time||"") < (b.time||"") ? -1 : 1); });
  h += rules.length ? '<div class="card">' + rules.map(function(r){
      return '<div class="item' + (r.active === false ? " off" : "") + '"><span class="grow"><b>' + DOW[r.weekday] + "</b>"
        + (r.time ? " &middot; " + esc(timeRange(r)) : "")
        + '<br><span class="small muted"><span class="pill ' + (r.type === "match" ? "pill-match" : "pill-training") + '">' + typeLabel(r.type) + "</span> "
        + esc(r.label || "") + (r.from || r.to ? " &middot; " + (r.from ? "ab " + fmtShort(r.from) : "") + (r.to ? " bis " + fmtShort(r.to) : "") : "") + "</span></span>"
        + '<button class="btn btn-sm" data-act="togglerule" data-id="' + r.id + '">' + (r.active === false ? "Aktivieren" : "Pausieren") + "</button>"
        + confirmRow(r.id, "Löschen", "delrule") + "</div>";

    : '<div class="card empty">Noch keine wöchentlichen Termine.</div>';

  h += '<div class="card" style="padding:13px;margin-top:12px"><div class="formgrid">'
    + field("r-type", "Art", '<select id="r-type"><option value="training">Training</option><option value="match">Wettkampf</option></select>')
    + field("r-day", "Wochentag", '<select id="r-day">' + DOW.map(function(d, i){ return '<option value="' + i + '"' + (i === 2 ? " selected" : "") + ">" + d + "</option>"; }).join("") + "</select>")

    + field("r-from", "Gültig ab", '<input type="date" id="r-from" value="' + esc(DB.settings.seasonStart || "") + '">')
    + field("r-to", "Gültig bis", '<input type="date" id="r-to" value="' + esc(DB.settings.seasonEnd || "") + '">')
    + '</div><button class="btn btn-primary btn-block" style="margin-top:10px" data-act="addrule">Serie hinzufügen</button></div>';

  h += '<div class="eyebrow">Einzeltermine</div>';
  var sing = DB.singles.slice().sort(sortByDate).reverse();
  h += sing.length ? '<div class="card">' + sing.map(function(g){
      return '<div class="item"><span class="grow"><b>' + fmtShort(g.date) + "</b>" + (g.time ? " &middot; " + esc(timeRange(g)) : "")
        + '<br><span class="small muted"><span class="pill ' + (g.type === "match" ? "pill-match" : "pill-training") + '">' + typeLabel(g.type) + "</span> " + esc(g.label || "") + "</span></span>"
        + confirmRow(g.id, "Löschen", "delsingle") + "</div>";
    }).join("") + "</div>"
    : '<div class="card empty">Noch keine Einzeltermine.</div>';

  h += '<div class="card" style="padding:13px;margin-top:12px"><div class="formgrid">'
    + field("s-type", "Art", '<select id="s-type"><option value="match">Wettkampf</option><option value="training">Training</option></select>')
    + field("s-date", "Datum", '<input type="date" id="s-date" value="' + todayISO() + '">')
    + field("s-time", "Von", '<input type="time" id="s-time" value="10:00">')
    + field("s-end", "Bis", '<input type="time" id="s-end" value="">')
    + '</div><div class="formgrid" style="margin-top:10px">'
    + field("s-label", "Bezeichnung (optional)", '<input type="text" id="s-label" placeholder="z. B. Meisterschaftsspiel gegen FC Muster">')
    + '</div><button class="btn btn-primary btn-block" style="margin-top:10px" data-act="addsingle">Einzeltermin hinzufügen</button></div>';
