/* ===================== Trainer-Planung (Zu-/Absagen) ===================== */
function viewPlanIdentity(){
  var coaches = activeCoaches();
  if (!coaches.length) {
    return '<div class="card empty">Noch keine Trainer erfasst. <button class="btn btn-sm" data-act="go" data-view="admin" data-tab="coaches" style="margin-top:10px">Trainer anlegen</button></div>';
  }
  return '<div class="card pickcoach">'
    + '<div class="lock-mark">👤</div>'
    + '<b>Wer bist du?</b>'
    + '<p class="muted small">Wähle deinen Namen aus, um für anstehende Termine zu- oder abzusagen.</p>'
    + '</div>'
    + '<div class="card" style="padding:6px;margin-top:14px"><div class="stack-s">'
    + coaches.map(function(c){
        return '<button class="btn btn-block" data-act="chooseplan" data-id="' + esc(c.id) + '" style="justify-content:flex-start;text-align:left">' + esc(fullName(c)) + "</button>";
      }).join("")
    + "</div></div>";
}

function viewPlanning(){
  var me = myCoachId();
  var meObj = byId(DB.coaches, me);
  var occs = planOccurrences();

  var h = '<div class="card whoami">'
    + "<span>Du bist: <b>" + esc(meObj ? fullName(meObj) : "") + "</b></span>"
    + '<button class="btn btn-sm" data-act="planswitch">Wechseln</button>'
    + "</div>";

  if (!occs.length) {
    h += '<div class="eyebrow">Anstehende Termine</div><div class="card empty">Keine anstehenden Termine bis Saisonende.</div>';
    return h;
  }
  var MONTH_LONG = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  var month = null;
  occs.forEach(function(o){
    var d = parseISO(o.date), key = d.getFullYear() + "-" + d.getMonth();
    if (key !== month) {
      if (month !== null) h += "</ul></div>";
      h += '<div class="eyebrow">' + MONTH_LONG[d.getMonth()] + " " + d.getFullYear() + '</div><div class="card"><ul class="avlist">';
      month = key;
    }
    var st = availabilityFor(o.id, me).status;
    var tl = tallyFor(o.id);
    h += '<li class="avitem">'
      + '<button class="avhead" data-act="planopen" data-occ="' + esc(o.id) + '">'
      + "<b>" + fmtShort(o.date) + " · " + esc(o.label || typeLabel(o.type)) + "</b>"
      + '<span><span class="pill ' + (o.type === "match" ? "pill-match" : "pill-training") + '" style="margin-right:6px">' + typeLabel(o.type) + "</span>"
      + (timeRange(o) || "") + "</span></button>"
      + '<button class="avtally" data-act="planopen" data-occ="' + esc(o.id) + '">'
      + '<span class="t-yes">👍 ' + tl.confirmed + '</span>'
      + '<span class="t-maybe">❓ ' + tl.uncertain + '</span>'
      + '<span class="t-no">👎 ' + tl.declined + '</span>'
      + "</button>"
      + '<div class="avbtns">'
      + '<button class="yes" data-act="quickavail" data-occ="' + esc(o.id) + '" data-status="confirmed" aria-pressed="' + (st === "confirmed") + '" aria-label="Verfügbar">👍</button>'
      + '<button class="maybe" data-act="quickavail" data-occ="' + esc(o.id) + '" data-status="uncertain" aria-pressed="' + (st === "uncertain") + '" aria-label="Ungewiss">❓</button>'
      + '<button class="no" data-act="quickavail" data-occ="' + esc(o.id) + '" data-status="declined" aria-pressed="' + (st === "declined") + '" aria-label="Nicht verfügbar">👎</button>'
      + "</div>"
      + "</li>";
  });
  h += "</ul></div>";
  return h;
}

function viewPlanDetail(){
  var occ = plannedOccurrences(todayISO(), seasonTo()).filter(function(o){ return o.id === UI.planOcc; })[0];
  if (!occ) return '<div class="card empty"><b>Termin nicht gefunden</b>Er wurde im Admin-Bereich inzwischen verändert oder gelöscht.</div>';
  var coaches = activeCoaches();
  var me = myCoachId();

  var groups = {confirmed: [], uncertain: [], declined: [], pending: []};
  coaches.forEach(function(c){
    var a = availabilityFor(occ.id, c.id);
    groups[a.status].push({c: c, reason: a.reason});
  });

  var h = '<div class="card sheet-head">'
    + '<div class="row" style="gap:8px"><span class="pill ' + (occ.type === "match" ? "pill-match" : "pill-training") + '">' + typeLabel(occ.type) + "</span></div>"
    + '<div class="sheet-title">' + esc(occ.label || typeLabel(occ.type)) + "</div>"
    + '<div class="muted small">' + fmtDate(occ.date) + (occ.time ? " &middot; " + esc(timeRange(occ)) : "") + "</div>"
    + "</div>";

  h += '<div class="card" style="padding:13px">'
    + group("👍 Verfügbar", groups.confirmed)
    + group("❓ Ungewiss", groups.uncertain)
    + group("👎 Nicht verfügbar", groups.declined)
    + group("⏳ Ausstehend", groups.pending)
    + "</div>";

  if (me) {
    var st = availabilityFor(occ.id, me).status;
    h += '<div class="eyebrow">Deine Antwort</div><div class="card" style="padding:13px">'
      + '<div class="avbtns">'
      + '<button class="yes" data-act="quickavail" data-occ="' + esc(occ.id) + '" data-status="confirmed" aria-pressed="' + (st === "confirmed") + '" style="font-size:13px">👍 Verfügbar</button>'
      + '<button class="maybe" data-act="quickavail" data-occ="' + esc(occ.id) + '" data-status="uncertain" aria-pressed="' + (st === "uncertain") + '" style="font-size:13px">❓ Ungewiss</button>'
      + '<button class="no" data-act="quickavail" data-occ="' + esc(occ.id) + '" data-status="declined" aria-pressed="' + (st === "declined") + '" style="font-size:13px">👎 Absagen</button>'
      + "</div></div>";
  } else {
    h += '<div class="banner" style="margin-top:14px">Wähle in der Planung aus, wer du bist, um selbst zu antworten.</div>';
  }
  return h;

  function group(title, list){
    var out = '<div class="avgroup"><h3>' + title + " (" + list.length + ")</h3>";
    if (!list.length) { out += '<p class="avempty">niemand</p></div>'; return out; }
    out += '<div class="avnames">' + list.map(function(x){
      return "<span>" + esc(fullName(x.c)) + (x.reason ? ' <span class="why">(' + esc(x.reason) + ")</span>" : "") + "</span>";
    }).join("") + "</div></div>";
    return out;
  }
}

/* ===================== Team- und PIN-Sperre ===================== */
// PIN, Admin-PIN und "wer bin ich" werden pro Team getrennt gemerkt (Schluessel
// enthaelt die Team-ID) - sonst koennte beim Wechseln des Teams auf demselben
// Geraet der PIN oder die Trainer-Auswahl des einen Teams beim anderen
// landen, obwohl es voellig unabhaengige Tabellen mit unabhaengigen IDs sind.
function storedTeam(){ try { return localStorage.getItem("tp.team") || ""; } catch(e){ return ""; } }
function setStoredTeam(id){ try { if (id) localStorage.setItem("tp.team", id); else localStorage.removeItem("tp.team"); } catch(e){} }
function storedPin(teamId){ try { return localStorage.getItem("tp.pin." + teamId) || ""; } catch(e){ return ""; } }
function setStoredPin(teamId, pin){ try { if (pin) localStorage.setItem("tp.pin." + teamId, pin); else localStorage.removeItem("tp.pin." + teamId); } catch(e){} }
function pinOf(kind){ return kind === "admin" ? ((DB && DB.settings.adminPin) || "") : PIN; }
function checkAdmin(){
  ADMIN_OK = !DB.settings.adminPin;
  try { if (!ADMIN_OK && TEAM && sessionStorage.getItem("tp.admin." + TEAM.id) === DB.settings.adminPin) ADMIN_OK = true; } catch(e){}
}
function addDigit(d){
  var kind = UNLOCKED ? "admin" : "app";
  if (LOADING || !/^[0-9]$/.test(d) || PINBUF.length >= 16) return;
  PINBUF += d;
  render();
  // Nur beim Admin-PIN ist die Laenge bekannt - dort darf automatisch geprueft
  // werden. Der App-PIN wird immer erst mit "Weiter" abgeschickt.
  if (kind === "admin" && PINBUF.length >= pinOf("admin").length) setTimeout(function(){ submitPin(kind); }, 90);
}
function shake(){
  var l = el("lock");
  if (l) { l.classList.add("bad"); setTimeout(function(){ l.classList.remove("bad"); }, 400); }
}
function viewLock(kind){
  // Beim Admin-PIN ist die Laenge bekannt, beim App-PIN nicht: dort waechst die
  // Anzeige mit der Eingabe und ein Feld bleibt immer frei.
  var len = kind === "admin" ? (pinOf("admin").length || 4) : Math.max(PINBUF.length + 1, 4);
  var dots = "";
  for (var i = 0; i < len; i++) dots += '<i class="' + (i < PINBUF.length ? "on" : "") + '"></i>';
  var keys = "";
  [1,2,3,4,5,6,7,8,9].forEach(function(n){ keys += '<button data-act="pin" data-d="' + n + '">' + n + "</button>"; });
  keys += '<button class="wide" data-act="pinclear">Löschen</button>'
        + '<button data-act="pin" data-d="0">0</button>'
        + '<button class="wide" data-act="pindel">&#9003;</button>';
  var extra = kind === "app"
    ? '<button class="btn btn-primary btn-block" data-act="pinok"' + (LOADING || !PINBUF ? " disabled" : "") + ">"
      + (LOADING ? "Bitte warten …" : "Weiter") + "</button>"
    : "";
  var teamName = DB ? (DB.settings.team || TITLE) : (TEAM ? TEAM.name : TITLE);
  return '<div class="lock" id="lock"><div class="lock-card">'
    + '<div class="lock-mark">' + (kind === "admin" ? "A" : "⚽") + "</div>"
    + '<div class="lock-title">' + (kind === "admin" ? "Admin-Bereich" : esc(teamName)) + "</div>"
    + '<p class="lock-sub">' + (kind === "admin" ? "Admin-PIN eingeben" : (LOADING ? "Daten werden geladen …" : "PIN eingeben, dann «Weiter»")) + "</p>"
    + '<div class="dots">' + dots + "</div>"
    + '<div class="keys">' + keys + "</div>"
    + (extra ? '<div style="width:100%;max-width:262px">' + extra + "</div>" : "")
    + (kind === "app" && TEAMS.length > 1 && !LOADING
        ? '<button class="btn btn-ghost btn-sm" data-act="changeteam">Anderes Team wählen</button>' : "")
    + (FAIL ? '<div class="banner" style="text-align:left">' + esc(FAIL)
        + '<div style="margin-top:10px"><button class="btn btn-sm" data-act="retry">Nochmals versuchen</button></div></div>' : "")
    + "</div></div>";
}
function submitPin(kind){
  if (kind === "admin") {
    if (PINBUF === pinOf("admin")) {
      try { if (TEAM) sessionStorage.setItem("tp.admin." + TEAM.id, PINBUF); } catch(e){}
      PINBUF = ""; ADMIN_OK = true; render();
    } else {
      PINBUF = ""; render(); shake(); toast("Falscher Admin-PIN.");
    }
    return;
  }
  boot(PINBUF);   // der App-PIN wird auf dem Server geprüft
}

/* ===================== Bericht / Druckansicht ===================== */
function viewReport(){
  var recs = statRecords();
  var stats = playerStats(recs).filter(function(x){ return x.total > 0 || x.p.active !== false; }).sort(function(a,b){ return sortName(a.p, b.p); });
  var sumHere = 0, sumTot = 0;
  stats.forEach(function(x){ sumHere += x.here; sumTot += x.total; });
  var zeit = UI.statRange === "season"
    ? ((DB.settings.seasonStart ? fmtShort(DB.settings.seasonStart) : "Saisonbeginn") + " bis " + (DB.settings.seasonEnd ? fmtShort(DB.settings.seasonEnd) : "Saisonende"))
    : ("letzte " + UI.statRange + " Tage");
  var art = UI.statType === "all" ? "Training und Wettkampf" : typeLabel(UI.statType);

  var h = '<div class="stack-s noprint" style="margin-bottom:14px">'
    + '<button class="btn btn-primary btn-block" data-act="print">Drucken / als PDF sichern</button>'
    + '<button class="btn btn-block" data-act="export">Für Excel exportieren (CSV)</button>'
    + '<p class="small muted" style="margin:2px 0 0">Öffnet sich kein Druckdialog, im Browsermenü «Drucken» wählen – dort lässt sich «Als PDF sichern» auswählen.</p></div>';

  h += '<div class="report">'
    + '<div class="rep-head"><b>' + esc(DB.settings.team || TITLE) + "</b>"
    + "<span>Anwesenheitsbericht &middot; Saison " + esc(DB.settings.season || "–") + " &middot; " + esc(art)
    + "<br>Zeitraum: " + esc(zeit) + " &middot; erstellt am " + fmtDate(todayISO()) + "</span></div>";

  h += "<h2>Überblick</h2>"
    + '<div class="tblwrap"><table class="grid" style="width:auto;min-width:min(100%,420px)">'
    + "<thead><tr><th>Erfasste Termine</th><th>Trainings</th><th>Wettkämpfe</th><th>Spieler</th><th>Gesamtquote</th></tr></thead><tbody><tr>"
    + '<td class="num">' + recs.length + "</td>"
    + '<td class="num">' + recs.filter(function(r){ return r.type === "training"; }).length + "</td>"
    + '<td class="num">' + recs.filter(function(r){ return r.type === "match"; }).length + "</td>"
    + '<td class="num">' + stats.length + "</td>"
    + '<td class="num"><b>' + pct(sumHere, sumTot) + "%</b></td></tr></tbody></table></div>";

  h += "<h2>Anwesenheit pro Spieler</h2>"
    + '<div class="tblwrap"><table class="grid"><thead><tr><th>#</th><th>Vorname</th><th>Nachname</th>'
    + '<th class="num">A</th><th class="num">V</th><th class="num">E</th><th class="num">F</th>'
    + '<th class="num">Termine</th><th class="num">Quote</th></tr></thead><tbody>'
    + stats.map(function(x, i){
        return "<tr><td>" + (i+1) + "</td><td>" + esc(x.p.first) + "</td><td>" + esc(x.p.last) + '</td><td class="num">'
          + x.present + '</td><td class="num">' + x.late + '</td><td class="num">' + x.excused + '</td><td class="num">'
          + x.absent + '</td><td class="num">' + x.total + '</td><td class="num"><b>' + x.quote + "%</b></td></tr>";
      }).join("") + "</tbody></table></div>";

  h += "<h2>Termine</h2>"
    + '<div class="tblwrap"><table class="grid"><thead><tr><th>Datum</th><th>Tag</th><th>Zeit</th><th>Art</th><th>Bezeichnung</th><th>Trainer</th><th class="num">Anwesend</th><th class="num">Quote</th></tr></thead><tbody>'
    + recs.map(function(r){
        var here = 0, tot = 0;
        for (var k in r.entries) { tot++; if (r.entries[k] === "present" || r.entries[k] === "late") here++; }
        var cn = (r.coachIds || []).map(function(id){ var c = byId(DB.coaches, id); return c ? fullName(c) : null; }).filter(Boolean).join(", ");
        return "<tr><td>" + fmtShort(r.date) + "</td><td>" + DOW_S[dowOf(r.date)] + "</td><td>" + esc(timeRange(r) || "–")
          + "</td><td>" + typeLabel(r.type) + "</td><td>" + esc(r.label || "") + "</td><td>" + (esc(cn) || "–")
          + '</td><td class="num">' + here + " / " + tot + '</td><td class="num">' + pct(here, tot) + "%</td></tr>";
      }).join("") + "</tbody></table></div>";

  if (recs.length && recs.length <= 40) {
    h += "<h2>Anwesenheitsmatrix</h2>"
      + '<div class="tblwrap"><table class="grid"><thead><tr><th>Spieler</th>'
      + recs.map(function(r){ return "<th>" + fmtShort(r.date).slice(0, 9) + "<br>" + (r.type === "match" ? "W" : "T") + "</th>"; }).join("")
      + '<th class="num">Quote</th></tr></thead><tbody>'
      + stats.map(function(x){
          return "<tr><td>" + esc(x.p.first) + " " + esc(x.p.last) + "</td>"
            + recs.map(function(r){
                var st = r.entries[x.p.id];
                return '<td class="mx ' + (st ? "mx-" + st : "") + '">' + (st ? SK[st].ab : "·") + "</td>";
              }).join("") + '<td class="num"><b>' + x.quote + "%</b></td></tr>";
        }).join("") + "</tbody></table></div>";
  } else if (recs.length > 40) {
    h += '<p class="small muted">Die Anwesenheitsmatrix wird ab 40 Terminen nicht mehr gedruckt – für die vollständigen Einzeldaten den CSV-Export verwenden.</p>';
  }

  h += '<p class="small muted" style="margin-top:14px">A = anwesend &middot; V = verspätet &middot; E = entschuldigt &middot; F = fehlt &middot; T = Training &middot; W = Wettkampf<br>'
    + "Quote = (anwesend + verspätet) / erfasste Termine des Spielers.</p></div>";
  return h;
}

/* ===================== Team-Auswahl ===================== */
function viewTeamPicker(){
  return '<div class="lock"><div class="lock-card">'
    + '<div class="lock-mark">⚽</div>'
    + '<div class="lock-title">' + TITLE + '</div>'
    + '<p class="lock-sub">Für welches Team?</p>'
    + '<div class="stack" style="width:100%;max-width:280px">' + TEAMS.map(function(t){
        return '<button class="btn btn-primary btn-block" data-act="chooseteam" data-id="' + esc(t.id) + '">' + esc(t.name) + "</button>";
      }).join("") + "</div>"
    + "</div></div>";
}

/* ===================== Rendering ===================== */
function render(){
  if (!TEAM) { el("root").innerHTML = TEAMS.length ? viewTeamPicker() : '<div class="lock"><div class="lock-card"><div class="lock-title">Kein Team eingerichtet</div><p class="lock-sub">In docs/config.js fehlt die Team-Liste.</p></div></div>'; return; }
  if (!UNLOCKED || !DB) { el("root").innerHTML = viewLock("app"); return; }
  var team = DB.settings.team || TITLE;
  var sub = DB.settings.season ? "Saison " + DB.settings.season : "Anwesenheit";
  var back = (UI.view === "record" || UI.view === "adhoc" || UI.view === "report" || UI.view === "plandetail");
  var body =
      UI.view === "record"     ? viewRecord()
    : UI.view === "adhoc"      ? viewAdhoc()
    : UI.view === "report"     ? viewReport()
    : UI.view === "stats"      ? viewStats()
    : UI.view === "planning"   ? (myCoachId() ? viewPlanning() : viewPlanIdentity())
    : UI.view === "plandetail" ? viewPlanDetail()
    : UI.view === "admin"      ? (ADMIN_OK ? viewAdmin() : viewLock("admin"))
    : viewEvents();

  var pending = pendingCountFor(myCoachId());
  var planBadge = pending > 0 ? '<span class="navbadge">' + (pending > 9 ? "9+" : pending) + "</span>" : "";
  var nav = '<nav class="nav"><div class="nav-in">'
    + navBtn("events", "Termine", ICON.cal)
    + '<button data-act="go" data-view="planning"' + ((UI.view === "planning" || UI.view === "plandetail") ? ' aria-current="page"' : "") + ">" + ICON.plan + planBadge + "<span>Planung</span></button>"
    + navBtn("stats", "Auswertung", ICON.chart) + navBtn("admin", "Admin", ICON.cog)
    + "</div></nav>";

  el("root").innerHTML =
      '<header class="topbar"><div class="topbar-in">'
    + (back ? '<button class="back" data-act="back">' + ICON.arrow + "Zurück</button>" : "")
    + '<span class="brand"><b>' + esc(team) + "</b><span>" + esc(sub) + "</span></span>"
    + "</div></header>"
    + '<main class="app">' + body + "</main>" + nav;
  window.scrollTo(0, UI.scroll || 0);
  UI.scroll = 0;
  try { sessionStorage.setItem("tp.ui", JSON.stringify({view:UI.view, occ:UI.occ, planOcc:UI.planOcc, myCoach:UI.myCoach, statType:UI.statType, statRange:UI.statRange, statSort:UI.statSort, adminTab:UI.adminTab})); } catch(e){}
}
function navBtn(v, label, icon){
  return '<button data-act="go" data-view="' + v + '"' + (UI.view === v || (v === "events" && (UI.view === "record" || UI.view === "adhoc")) || (v === "stats" && UI.view === "report") ? ' aria-current="page"' : "") + ">" + icon + "<span>" + label + "</span></button>";
}
function go(view){ UI.view = view; UI.confirm = null; UI.edit = null; PINBUF = ""; render(); }
function val(id){ var e = el(id); return e ? e.value.trim() : ""; }

/* ===================== Aktionen ===================== */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act]");
  if (!t) return;
  var a = t.getAttribute("data-act");
  var handler = ACT[a];
  if (!handler) return;
  ev.preventDefault();
  handler(t);
});
document.addEventListener("input", function(ev){
  var t = ev.target;
  if (t.getAttribute && t.getAttribute("data-act") === "note" && UI.state) {
    UI.state.note = t.value;
    saveDraft(UI.occ, UI.state);
  }
});
document.addEventListener("keydown", function(ev){
  if (ev.key === "Enter" && el("reasonDlg") && el("reasonDlg").open) {
    ev.preventDefault();
    ACT.reasonok();
  }
});

function updateSheet(){
  var st = UI.state;
  document.querySelectorAll(".plist li").forEach(function(li){
    var pid = li.getAttribute("data-player");
    li.querySelectorAll(".seg button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-status") === st.entries[pid]));
    });
  });
  var tot = document.querySelectorAll(".plist li").length;
  var box = el("tally"); if (box) box.innerHTML = tallyHtml(st, tot);
  saveDraft(UI.occ, st);
}

var ACT = {
  go: function(t){
    var v = t.getAttribute("data-view");
    if (t.getAttribute("data-tab")) UI.adminTab = t.getAttribute("data-tab");
    go(v);
  },
  back: function(){ go(UI.view === "report" ? "stats" : UI.view === "plandetail" ? "planning" : "events"); },
  report: function(){ go("report"); },
  print: function(){ try { window.print(); } catch(e){ toast("Der Browser hat das Drucken blockiert – bitte über das Browsermenü drucken."); } },
  pin: function(t){ addDigit(t.getAttribute("data-d")); },
  pinok: function(){ submitPin(UNLOCKED ? "admin" : "app"); },
  pindel: function(){ PINBUF = PINBUF.slice(0, -1); render(); },
  pinclear: function(){ PINBUF = ""; render(); },
  lock: function(){
    var tid = TEAM && TEAM.id;
    try {
      if (tid) { localStorage.removeItem("tp.pin." + tid); sessionStorage.removeItem("tp.admin." + tid); }
      setStoredTeam("");
    } catch(e){}
    PINBUF = ""; PIN = ""; DB = null; TEAM = null; UNLOCKED = false; ADMIN_OK = false;
    UI = {view:"events", occ:null, planOcc:null, statType:"all", statRange:"season", statSort:"quote", adminTab:"players"};
    render();
  },
  chooseteam: function(t){
    var id = t.getAttribute("data-id");
    TEAM = TEAMS.filter(function(x){ return x.id === id; })[0] || null;
    if (!TEAM) return;
    setStoredTeam(TEAM.id);
    FAIL = null;
    render();
    var p = storedPin(TEAM.id);
    if (p) boot(p);
  },
  changeteam: function(){
    PINBUF = ""; FAIL = null; DB = null; PIN = ""; UNLOCKED = false; TEAM = null;
    UI = {view:"events", occ:null, planOcc:null, statType:"all", statRange:"season", statSort:"quote", adminTab:"players"};
    render();
  },
  open: function(t){ UI.occ = t.getAttribute("data-occ"); UI.confirm = null; go("record"); },
  adhoc: function(){ go("adhoc"); },
  adhocgo: function(){
    var d = val("a-date"); if (!d) { toast("Bitte ein Datum wählen."); return; }
    UI.adhoc = {id: uid("x"), date: d, time: val("a-time"), timeEnd: val("a-end"), type: val("a-type"), label: val("a-label")};
    UI.occ = UI.adhoc.id; go("record");
  },
  planopen: function(t){ UI.planOcc = t.getAttribute("data-occ"); go("plandetail"); },
  chooseplan: function(t){
    var id = t.getAttribute("data-id");
    UI.myCoach = id;
    setStoredCoach(id);
    render();
  },
  planswitch: function(){
    UI.myCoach = "";
    setStoredCoach("");
    render();
  },
  quickavail: function(t){
    var occId = t.getAttribute("data-occ"), status = t.getAttribute("data-status"), me = myCoachId();
    if (!me) { toast("Bitte zuerst auswählen, wer du bist."); return; }
    var current = availabilityFor(occId, me).status;
    if (status === "confirmed" || status === "uncertain") {
      commitAvailability(occId, me, current === status ? "pending" : status);
      return;
    }
    // Absagen: bei bereits aktiver Absage per erneutem Klick zuruecksetzen,
    // sonst Grund erfragen.
    if (current === "declined") { commitAvailability(occId, me, "pending"); return; }
    PLAN_DECLINE = {occ: occId, coach: me};
    var input = el("reasonInput"); if (input) input.value = "";
    var dlg = el("reasonDlg");
    if (dlg && dlg.showModal) dlg.showModal();
  },
  reasoncancel: function(){ var dlg = el("reasonDlg"); if (dlg) dlg.close(); PLAN_DECLINE = null; },
  reasonok: function(){
    var dlg = el("reasonDlg");
    if (!PLAN_DECLINE) { if (dlg) dlg.close(); return; }
    var reason = (el("reasonInput") && el("reasonInput").value || "").trim();
    var p = PLAN_DECLINE; PLAN_DECLINE = null;
    if (dlg) dlg.close();
    commitAvailability(p.occ, p.coach, "declined", reason);
  },
  coach: function(t){
    var id = t.getAttribute("data-id"), st = UI.state, i = st.coachIds.indexOf(id);
    if (i >= 0) st.coachIds.splice(i, 1); else st.coachIds.push(id);
    saveDraft(UI.occ, st);
    UI.scroll = window.scrollY;
    render();
  },
  mark: function(t){
    var pid = t.getAttribute("data-player"), s = t.getAttribute("data-status"), st = UI.state;
    if (st.entries[pid] === s) delete st.entries[pid]; else st.entries[pid] = s;
    updateSheet();
  },
  all: function(t){
    var s = t.getAttribute("data-status"), st = UI.state;
    st.entries = {};
    if (s) document.querySelectorAll(".plist li").forEach(function(li){ st.entries[li.getAttribute("data-player")] = s; });
    updateSheet();
  },
  save: function(){
    var occ = findOccurrence(UI.occ), st = UI.state;
    if (!occ) return;
    if (activeCoaches().length && !st.coachIds.length) { toast("Bitte mindestens einen anwesenden Trainer wählen."); return; }
    var n = 0; for (var k in st.entries) n++;
    if (!n) { toast("Bitte mindestens einen Spieler erfassen."); return; }
    var names = st.coachIds.map(function(id){ var c = byId(DB.coaches, id); return c ? fullName(c) : null; }).filter(Boolean).join(", ");
    var stamp = fmtShort(todayISO()) + " " + pad(new Date().getHours()) + ":" + pad(new Date().getMinutes());
    var id = UI.occ;
    commit(function(db){
      var rec = byId(db.records, id);
      if (!rec) { rec = {id: id, createdAt: stamp, createdBy: names}; db.records.push(rec); }
      rec.date = occ.date; rec.time = occ.time || ""; rec.timeEnd = occ.timeEnd || "";
      rec.type = occ.type; rec.label = occ.label || "";
      rec.coachIds = st.coachIds.slice();
      rec.entries = Object.assign({}, st.entries);
      rec.note = st.note || "";
      rec.updatedAt = stamp; rec.updatedBy = names;
    }, "Anwesenheit gespeichert.", {view: "events", occ: null}).then(function(ok){
      if (ok) { clearDraft(id); UI.view = "events"; UI.adhoc = null; render(); }
    });
  },
  dropdraft: function(){ clearDraft(UI.occ); go("events"); toast("Entwurf verworfen."); },
  delrec: function(t){
    if (UI.confirm !== "rec") { UI.confirm = "rec"; render(); toast("Nochmals tippen, um die Erfassung zu löschen."); return; }
    var id = UI.occ;
    commit(function(db){ db.records = db.records.filter(function(r){ return r.id !== id; }); },
      "Erfassung gelöscht.", {view: "events", occ: null})
      .then(function(ok){ if (ok) { clearDraft(id); UI.confirm = null; UI.view = "events"; render(); } });
  },
  stype: function(t){ UI.statType = t.getAttribute("data-v"); render(); },
  srange: function(t){ UI.statRange = t.getAttribute("data-v"); render(); },
  ssort: function(){ UI.statSort = UI.statSort === "quote" ? "name" : "quote"; render(); },
  export: function(){ exportCsv(); },
  atab: function(t){ UI.adminTab = t.getAttribute("data-v"); UI.edit = null; UI.confirm = null; render(); },
  ask: function(t){ UI.confirm = t.getAttribute("data-id") || null; render(); },
  canceledit: function(){ UI.edit = null; render(); },
  editperson: function(t){ UI.edit = {kind: t.getAttribute("data-kind"), id: t.getAttribute("data-id")}; render(); },
  addperson: function(t){
    var kind = t.getAttribute("data-kind"), first = val("n-first"), last = val("n-last"), role = val("n-role");
    if (!first && !last) { toast("Bitte Vor- und Nachname eingeben."); return; }
    commit(function(db){
      var p = {id: uid("p"), first: first, last: last, active: true};
      if (kind === "coaches") { p.role = role; db.coaches.push(p); } else db.players.push(p);
    }, (last || first) + " hinzugefügt.");
  },
  saveperson: function(t){
    var kind = t.getAttribute("data-kind"), id = t.getAttribute("data-id");
    var first = val("e-first"), last = val("e-last"), role = val("e-role");
    commit(function(db){
      var p = byId(kind === "coaches" ? db.coaches : db.players, id);
      if (p) { p.first = first; p.last = last; if (kind === "coaches") p.role = role; }
    }, "Gespeichert.").then(function(ok){ if (ok) UI.edit = null; });
  },
  toggleperson: function(t){
    var kind = t.getAttribute("data-kind"), id = t.getAttribute("data-id");
    commit(function(db){
      var p = byId(kind === "coaches" ? db.coaches : db.players, id);
      if (p) p.active = (p.active === false);
    }, "Gespeichert.");
  },
  delperson: function(t){
    var kind = t.getAttribute("data-kind"), id = t.getAttribute("data-id");
    commit(function(db){
      if (kind === "coaches") {
        db.coaches = db.coaches.filter(function(c){ return c.id !== id; });
        db.records.forEach(function(r){ r.coachIds = (r.coachIds || []).filter(function(c){ return c !== id; }); });
      } else {
        db.players = db.players.filter(function(p){ return p.id !== id; });
        db.records.forEach(function(r){ if (r.entries) delete r.entries[id]; });
      }
    }, "Gelöscht.").then(function(ok){ if (ok) UI.confirm = null; });
  },
  bulk: function(t){
    var kind = t.getAttribute("data-kind"), raw = el("bulk") ? el("bulk").value : "";
    var rows = raw.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
    if (!rows.length) { toast("Bitte zuerst Namen eintragen."); return; }
    commit(function(db){
      rows.forEach(function(line){
        var first = "", last = "";
        if (line.indexOf(",") >= 0) { var a = line.split(","); last = a[0].trim(); first = (a[1] || "").trim(); }
        else { var w = line.split(/\s+/); last = w.pop(); first = w.join(" "); }
        var p = {id: uid("p"), first: first, last: last, active: true};
        if (kind === "coaches") { p.role = ""; db.coaches.push(p); } else db.players.push(p);
      });
    }, rows.length + " Einträge hinzugefügt.");
  },
  addrule: function(){
    var time = val("r-time");
    commit(function(db){
      db.rules.push({id: uid("r"), type: val("r-type"), weekday: Number(val("r-day")), time: time, timeEnd: val("r-end"),
        label: val("r-label"), from: val("r-from"), to: val("r-to"), active: true});
    }, "Serie hinzugefügt.");
  },
  togglerule: function(t){
    var id = t.getAttribute("data-id");
    commit(function(db){ var r = byId(db.rules, id); if (r) r.active = (r.active === false); }, "Gespeichert.");
  },
  delrule: function(t){
    var id = t.getAttribute("data-id");
    commit(function(db){ db.rules = db.rules.filter(function(r){ return r.id !== id; }); }, "Serie gelöscht.")
      .then(function(ok){ if (ok) UI.confirm = null; });
  },
  addsingle: function(){
    var d = val("s-date"); if (!d) { toast("Bitte ein Datum wählen."); return; }
    commit(function(db){
      db.singles.push({id: uid("s"), type: val("s-type"), date: d, time: val("s-time"), timeEnd: val("s-end"), label: val("s-label")});
    }, "Einzeltermin hinzugefügt.");
  },
  delsingle: function(t){
    var id = t.getAttribute("data-id");
    commit(function(db){ db.singles = db.singles.filter(function(s){ return s.id !== id; }); }, "Termin gelöscht.")
      .then(function(ok){ if (ok) UI.confirm = null; });
  },
  savesettings: function(){
    var team = val("t-team"), season = val("t-season"), s = val("t-start"), e = val("t-end");
    var pin = val("t-pin").replace(/\D/g, ""), apin = val("t-apin").replace(/\D/g, "");
    commit(function(db){ db.settings = {team: team, season: season, seasonStart: s, seasonEnd: e, pin: pin, adminPin: apin}; },
      "Gespeichert.").then(function(ok){
        if (ok && TEAM) {
          PIN = pin;   // ab jetzt gilt der neue PIN auch fuer diese Sitzung
          try {
            setStoredPin(TEAM.id, pin);
            if (apin) sessionStorage.setItem("tp.admin." + TEAM.id, apin);
          } catch(e2){}
        }
      });
  },
  backup: function(){
    if (download("trainingspraesenz-sicherung-" + todayISO() + ".json", JSON.stringify(DB, null, 2), "application/json"))
      toast("Sicherung gespeichert.");
  },
  sheet: function(){ if (SHEETURL) window.open(SHEETURL, "_blank", "noopener"); },
  retry: function(){ FAIL = null; if (TEAM) boot(PIN || storedPin(TEAM.id)); }
};

/* ===================== Start ===================== */
document.addEventListener("keydown", function(ev){
  if (!el("lock") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); addDigit(ev.key); }
  else if (ev.key === "Backspace") { ev.preventDefault(); PINBUF = PINBUF.slice(0, -1); render(); }
  else if (ev.key === "Enter") { ev.preventDefault(); if (PINBUF) submitPin(UNLOCKED ? "admin" : "app"); }
});
document.addEventListener("visibilitychange", function(){ if (!document.hidden) refresh(); });
window.addEventListener("online", function(){ if (FAIL && TEAM) boot(PIN || storedPin(TEAM.id)); });

// Team bestimmen: zuletzt gewaehltes Team, oder automatisch, wenn nur eines
// konfiguriert ist. Danach, falls fuer dieses Team schon ein PIN gemerkt ist,
// gleich versuchen anzumelden.
(function(){
  var savedTeamId = storedTeam();
  if (savedTeamId) TEAM = TEAMS.filter(function(t){ return t.id === savedTeamId; })[0] || null;
  if (!TEAM && TEAMS.length === 1) TEAM = TEAMS[0];
})();
render();
if (TEAM) { var initialPin = storedPin(TEAM.id); if (initialPin) boot(initialPin); }

})();
</script>
</body>
</html>
